<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Garden — Private Inbox</title><style>body{margin:0;background:#090a18;color:#f8f2ff;font:15px system-ui,sans-serif;padding:24px}.wrap{max-width:760px;margin:6vh auto}.card{background:#15152b;border:1px solid #bba5ff44;border-radius:18px;padding:24px}h1{font:36px Georgia,serif}.muted{color:#b9b3d2;line-height:1.6}input{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;background:#090a18;border:1px solid #766b9d;color:white;border-radius:9px}button{padding:11px 17px;border-radius:30px;background:#5d477e;color:white;border:1px solid #d3b6ff;cursor:pointer;margin:5px 4px 5px 0}.answer{border-top:1px solid #ffffff22;padding:14px 0;overflow-wrap:anywhere}.error{color:#ff9fc5}</style></head><body><div class="wrap"><div class="card"><p class="muted">THE SECRET GARDEN / PRIVATE INBOX</p><h1>Garden notes</h1><p class="muted">This dashboard needs your Supabase project URL and public anon key, plus an owner account. Do not put a service-role key in this page.</p><input id="url" placeholder="Supabase project URL"><input id="key" placeholder="Supabase anon / publishable key"><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Owner password"><button onclick="login()">Sign in</button><button onclick="loadAnswers()">Refresh answers</button><button onclick="logout()">Sign out</button><p id="status" class="muted" aria-live="polite"></p><div id="answers"></div></div></div><script>let client=null;async function lib(){if(!window.supabase){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}}async function setup(){await lib();let u=document.getElementById('url').value.trim(),k=document.getElementById('key').value.trim();if(!u||!k)throw Error('Enter the Supabase URL and public anon key.');client=window.supabase.createClient(u,k)}async function login(){try{await setup();let {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error)throw error;status.textContent='Signed in. Refresh to load notes.'}catch(e){status.textContent=e.message;status.className='error'}}async function loadAnswers(){try{if(!client)await setup();let {data:{session}}=await client.auth.getSession();if(!session)throw Error('Please sign in first.');let {data,error}=await client.from('garden_answers').select('id,created_at,question,answer').order('created_at',{ascending:false});if(error)throw error;answers.innerHTML='';(data||[]).forEach(a=>{let d=document.createElement('div');d.className='answer';let date=document.createElement('small');date.textContent=new Date(a.created_at).toLocaleString();let q=document.createElement('p');q.textContent=a.question;let ans=document.createElement('p');ans.textContent=a.answer;d.append(date,q,ans);answers.append(d)});status.textContent=`${data.length} answer(s) loaded.`}catch(e){status.textContent=e.message;status.className='error'}}async function logout(){if(client)await client.auth.signOut();answers.innerHTML='';status.textContent='Signed out.'}</script></body></html>
